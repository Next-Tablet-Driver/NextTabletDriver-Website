name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      # Links to the Vercel project so `vercel build` knows the framework/output config.
      # Does NOT pull PostHog vars — those come from GitHub Secrets below, not Vercel.
      - name: Link Vercel project
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          PUBLIC_POSTHOG_KEY: ${{ secrets.POSTHOG_KEY }}
          PUBLIC_POSTHOG_HOST: ${{ secrets.POSTHOG_HOST }}
          # Raises the GitHub API rate limit for the release fetch in src/lib/github.ts.
          # GITHUB_TOKEN is provided automatically by Actions, no secret to create.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy prebuilt output
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
